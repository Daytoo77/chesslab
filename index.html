<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChessLab — Training Suite</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <script>
      // set the theme before first paint so there is no dark/light flash
      (function () {
        try {
          var t = (JSON.parse(localStorage.getItem('chesslab_settings_v1')) || {}).state;
          t = (t && t.appTheme) || 'system';
          if (t === 'system') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="./icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
